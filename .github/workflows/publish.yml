name: 🚀 Publish Release

on:
  workflow_dispatch:
    inputs:
      increment-type:
        description: "Version increment type"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: 🧪 Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🧪 Run tests & build
        run: |
          echo "::group::Running tests"
          npm run test:coverage
          echo "::endgroup::"
          echo "::group::Building project"
          npm run build
          echo "::endgroup::"

      - name: 📦 Capture build details
        id: artifact
        run: |
          BUILD_DIR="build"
          if [[ ! -d "$BUILD_DIR" ]]; then
            echo "Build directory not found" >&2
            exit 1
          fi
          echo "build-dir=$BUILD_DIR" >> $GITHUB_OUTPUT
          echo "build-size=$(du -sh $BUILD_DIR | cut -f1)" >> $GITHUB_OUTPUT

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: ${{ steps.artifact.outputs.build-dir }}
          retention-days: 30

  version:
    name: 🏷️ Version & Tag
    runs-on: ubuntu-latest
    needs: build
    outputs:
      new-version: ${{ steps.version_calc.outputs.new-version }}
      new-version-no-v: ${{ steps.version_calc.outputs.new-version-no-v }}
      increment-type: ${{ steps.version_calc.outputs.increment-type }}
      emoji: ${{ steps.version_calc.outputs.emoji }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 🔍 Determine next version
        id: version_calc
        env:
          INCREMENT_TYPE: ${{ github.event.inputs.increment-type }}
        run: |
          set -euo pipefail
          echo "::group::Calculating version"
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"
          VERSION=${LATEST_TAG#v}
          IFS='.' read -ra PARTS <<< "$VERSION"
          MAJOR=${PARTS[0]:-0}
          MINOR=${PARTS[1]:-0}
          PATCH=${PARTS[2]:-0}

          # Ensure numeric values
          MAJOR=$((MAJOR + 0))
          MINOR=$((MINOR + 0))
          PATCH=$((PATCH + 0))

          # Use input increment type
          INCREMENT="$INCREMENT_TYPE"
          case "$INCREMENT" in
            major)
              EMOJI="🚀"
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor)
              EMOJI="✨"
              MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch)
              EMOJI="🐛"
              PATCH=$((PATCH + 1)) ;;
            *)
              echo "Invalid increment type: $INCREMENT" >&2
              exit 1 ;;
          esac

          NEW_VERSION_NO_V="$MAJOR.$MINOR.$PATCH"
          NEW_VERSION="v$NEW_VERSION_NO_V"

          echo "new-version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new-version-no-v=$NEW_VERSION_NO_V" >> "$GITHUB_OUTPUT"
          echo "increment-type=$INCREMENT" >> "$GITHUB_OUTPUT"
          echo "emoji=$EMOJI" >> "$GITHUB_OUTPUT"
          echo "$EMOJI $LATEST_TAG -> $NEW_VERSION ($INCREMENT)"
          echo "::endgroup::"

      - name: 📝 Update package.json version
        env:
          NEW_VERSION_NO_V: ${{ steps.version_calc.outputs.new-version-no-v }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [ "$CURRENT_VERSION" = "$NEW_VERSION_NO_V" ]; then
            echo "package.json already at version $NEW_VERSION_NO_V; skipping bump."
            exit 0
          fi
          npm version "$NEW_VERSION_NO_V" --no-git-tag-version

      - name: 📄 Show version change
        run: grep '"version"' package.json

      - name: 📚 Commit version bump
        env:
          NEW_VERSION: ${{ steps.version_calc.outputs.new-version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package.json; then
            echo "No version change to commit; skipping commit and push."
            exit 0
          fi
          git add package.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push origin ${{ github.ref_name }}

      - name: 🏷️ Create annotated tag
        env:
          NEW_VERSION: ${{ steps.version_calc.outputs.new-version }}
          INCREMENT: ${{ steps.version_calc.outputs.increment-type }}
          EMOJI: ${{ steps.version_calc.outputs.emoji }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$NEW_VERSION" >/dev/null; then
            echo "Tag $NEW_VERSION already exists; skipping tag creation."
            exit 0
          fi
          git tag -a "$NEW_VERSION" -m "$EMOJI Auto $INCREMENT release $NEW_VERSION"
          git push origin "$NEW_VERSION"

  release:
    name: 📦 Create GitHub Release
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.result == 'success'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 📥 Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: build-artifacts
          path: downloaded-build

      - name: 📦 Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ needs.version.outputs.new-version }}
          INCREMENT: ${{ needs.version.outputs.increment-type }}
          EMOJI: ${{ needs.version.outputs.emoji }}
        run: |
          NOTES_FILE=$(mktemp)
          {
            echo "## $EMOJI Release"
            echo "Manual release for $NEW_VERSION"
            echo ""
            echo "- Version increment: $INCREMENT"
            echo "- Released by: ${{ github.actor }}"
            echo ""
            echo "### 📦 Artifacts"
            echo "- Build artifacts available in workflow run"
          } > "$NOTES_FILE"
          gh release create "$NEW_VERSION" --title "$EMOJI Release $NEW_VERSION" --notes-file "$NOTES_FILE"

  docker:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [version, release]
    if: needs.version.result == 'success' && needs.release.result == 'success' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_REPO != ''
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.new-version }}
          fetch-tags: true

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗️ Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔍 Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_REPO }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.new-version-no-v }}
            type=raw,value=${{ needs.version.outputs.new-version }}
            type=sha,prefix=

      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_REPO }}:latest
          cache-to: type=inline
          build-args: |
            VERSION=${{ needs.version.outputs.new-version-no-v }}

      - name: 📝 Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_REPO }}
          readme-filepath: ./README.md
        continue-on-error: true

